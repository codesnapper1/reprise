<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#388bfd"/>
    </marker>
  </defs>

  <rect width="1000" height="380" rx="16" fill="url(#bg3)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="35" y="25" width="280" height="26" rx="6" fill="#1f6feb" fill-opacity="0.15" stroke="#388bfd" stroke-width="1"/>
  <text x="47" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#58a6ff" letter-spacing="1">COUNTEREXAMPLE REDUCTION</text>
  <text x="330" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#8b949e">Delta debugging reduces complex traces to 1-minimal explanations</text>

  <!-- Left Side: Raw Trace (Noisy) -->
  <g transform="translate(40, 80)">
    <rect width="400" height="260" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="400" height="36" rx="10" fill="#21262d"/>
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">RAW GENERATED TRACE (10 EVENTS)</text>
    <text x="340" y="23" font-family="ui-monospace, monospace" font-size="11" fill="#ff7b72">FAILS</text>

    <!-- Event Rows -->
    <g font-family="ui-monospace, monospace" font-size="11">
      <rect x="15" y="48" width="370" height="22" rx="4" fill="#2d1d1f"/>
      <text x="25" y="63" fill="#ff7b72">[t=0.0s] checkout.failed (A)</text>

      <rect x="15" y="74" width="370" height="22" rx="4" fill="#21262d"/>
      <text x="25" y="89" fill="#8b949e" text-decoration="line-through">[t=0.5s] telemetry.heartbeat</text>

      <rect x="15" y="100" width="370" height="22" rx="4" fill="#21262d"/>
      <text x="25" y="115" fill="#8b949e" text-decoration="line-through">[t=2.5s] telemetry.heartbeat</text>

      <rect x="15" y="126" width="370" height="22" rx="4" fill="#2d1d1f"/>
      <text x="25" y="141" fill="#ff7b72">[t=3.0s] gateway.captured (A)</text>

      <rect x="15" y="152" width="370" height="22" rx="4" fill="#21262d"/>
      <text x="25" y="167" fill="#8b949e" text-decoration="line-through">[t=4.5s] telemetry.heartbeat</text>

      <rect x="15" y="178" width="370" height="22" rx="4" fill="#2d1d1f"/>
      <text x="25" y="193" fill="#ff7b72">[t=5.0s] recovery.request (A)</text>

      <rect x="15" y="204" width="370" height="22" rx="4" fill="#21262d"/>
      <text x="25" y="219" fill="#8b949e" text-decoration="line-through">[t=8.0s] webhook.captured (A)</text>

      <text x="25" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e3b341">Breach: double_charge (+₹5,000)</text>
    </g>
  </g>

  <!-- Middle Transition Arrow -->
  <g transform="translate(460, 180)">
    <path d="M 0 25 L 60 25" stroke="#388bfd" stroke-width="3" marker-end="url(#arrowRight)"/>
    <text x="30" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#58a6ff" text-anchor="middle">minimize()</text>
    <text x="30" y="52" font-family="ui-monospace, monospace" font-size="9" fill="#8b949e" text-anchor="middle">14 deletion passes</text>
  </g>

  <!-- Right Side: 1-Minimal Counterexample -->
  <g transform="translate(540, 80)">
    <rect width="420" height="260" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
    <rect width="420" height="36" rx="10" fill="#1b2a20"/>
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7ee787">1-MINIMAL COUNTEREXAMPLE (3 EVENTS)</text>
    <text x="360" y="23" font-family="ui-monospace, monospace" font-size="11" fill="#ff7b72">FAILS</text>

    <g font-family="ui-monospace, monospace" font-size="11">
      <rect x="15" y="48" width="390" height="30" rx="4" fill="#2d1d1f" stroke="#f85149" stroke-width="1"/>
      <text x="25" y="67" fill="#ff7b72">1. [t=0.0s] checkout.failed</text>
      
      <rect x="15" y="88" width="390" height="30" rx="4" fill="#2d1d1f" stroke="#f85149" stroke-width="1"/>
      <text x="25" y="107" fill="#ff7b72">2. [t=3.0s] gateway.captured (late auth)</text>

      <rect x="15" y="128" width="390" height="30" rx="4" fill="#2d1d1f" stroke="#f85149" stroke-width="1"/>
      <text x="25" y="147" fill="#ff7b72">3. [t=5.0s] recovery.request (duplicate)</text>

      <rect x="15" y="170" width="390" height="75" rx="6" fill="#21262d"/>
      <text x="25" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7ee787">Guaranteed 1-Minimal Property:</text>
      <text x="25" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c9d1d9">Removing any single remaining event causes the violation to vanish.</text>
      <text x="25" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e">Ready to export as a reproducible JSON unit test.</text>
    </g>
  </g>
</svg>
