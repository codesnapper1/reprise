<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="greenArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" rx="16" fill="url(#bg4)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="35" y="25" width="290" height="26" rx="6" fill="#8957e5" fill-opacity="0.15" stroke="#bc8cff" stroke-width="1"/>
  <text x="47" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#d2a8ff" letter-spacing="1">MACHINE LEARNING WIND TUNNEL</text>
  <text x="340" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#8b949e">Learned Failure Search vs. Uniform Random Exploration</text>

  <!-- Left Chart: Cumulative Failures Discovered -->
  <g transform="translate(60, 90)">
    <!-- Axes -->
    <line x1="50" y1="20" x2="50" y2="220" stroke="#30363d" stroke-width="1.5"/>
    <line x1="50" y1="220" x2="450" y2="220" stroke="#30363d" stroke-width="1.5"/>

    <!-- Y-axis labels -->
    <text x="40" y="25" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="end">200</text>
    <text x="40" y="120" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="end">100</text>
    <text x="40" y="224" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="end">0</text>
    <line x1="46" y1="120" x2="450" y2="120" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="46" y1="20" x2="450" y2="20" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- X-axis labels -->
    <text x="50" y="240" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="middle">0</text>
    <text x="250" y="240" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="middle">100</text>
    <text x="450" y="240" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e" text-anchor="middle">200 Cases</text>

    <!-- Curve 1: Learned Search (32-tree Forest) -->
    <!-- Steeps up almost linearly to 200 -->
    <path d="M 50 220 L 100 170 L 150 120 L 250 20 L 450 20" fill="none" stroke="#3fb950" stroke-width="3"/>
    <circle cx="450" cy="20" r="5" fill="#3fb950"/>
    <text x="440" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#7ee787" text-anchor="end">Reprise Forest: 200/200</text>

    <!-- Curve 2: Random Selection -->
    <!-- Linear slope roughly 53% -->
    <path d="M 50 220 L 450 114" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="450" cy="114" r="4" fill="#8b949e"/>
    <text x="440" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">Random Mean: 106.1</text>

    <!-- 95% Confidence Interval for Random -->
    <rect x="445" y="100" width="10" height="27" fill="#8b949e" fill-opacity="0.3"/>
    <line x1="450" y1="100" x2="450" y2="127" stroke="#8b949e" stroke-width="1.5"/>
  </g>

  <!-- Right Side: Model Provenance & Edge Metrics Card -->
  <g transform="translate(560, 90)">
    <rect width="380" height="250" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="380" height="35" rx="10" fill="#21262d"/>
    <text x="20" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#d2a8ff">MODEL SPECIFICATION &amp; PROVENANCE</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <!-- Row 1 -->
      <text x="20" y="65" fill="#8b949e">Architecture</text>
      <text x="360" y="65" fill="#f0f6fc" font-weight="600" text-anchor="end">Random Forest (32 Trees, Depth ≤ 6)</text>

      <!-- Row 2 -->
      <text x="20" y="95" fill="#8b949e">Training Records</text>
      <text x="360" y="95" fill="#f0f6fc" font-weight="600" text-anchor="end">8,000 Executed Simulator Runs</text>

      <!-- Row 3 -->
      <text x="20" y="125" fill="#8b949e">Held-Out Evaluation</text>
      <text x="360" y="125" fill="#f0f6fc" font-weight="600" text-anchor="end">2,000 Disjoint Seeds</text>

      <!-- Row 4 -->
      <text x="20" y="155" fill="#8b949e">Precision / Recall</text>
      <text x="360" y="155" fill="#3fb950" font-weight="700" text-anchor="end">99.8% / 100.0% (ROC-AUC: 1.0)</text>

      <!-- Row 5 -->
      <text x="20" y="185" fill="#8b949e">Runtime Footprint</text>
      <text x="360" y="185" fill="#58a6ff" font-weight="600" text-anchor="end">Pure JSON (0 Python / 0 External APIs)</text>

      <!-- Row 6 -->
      <text x="20" y="215" fill="#8b949e">Sampling Strategy</text>
      <text x="360" y="215" fill="#e3b341" font-weight="600" text-anchor="end">80% Ranked + 20% Exploration</text>
    </g>
  </g>
</svg>
