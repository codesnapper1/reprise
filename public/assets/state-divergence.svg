<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1050" height="440" rx="16" fill="url(#bg2)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="35" y="25" width="240" height="26" rx="6" fill="#da3633" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="47" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff7b72" letter-spacing="1">STATE DIVERGENCE FAILURE</text>
  <text x="290" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#8b949e">Why payment agents double-charge under real-world network latency</text>

  <!-- Timeline Time markers -->
  <line x1="120" y1="95" x2="980" y2="95" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="160" y="85">t = 0s</text>
    <text x="360" y="85">t = 3s</text>
    <text x="560" y="85">t = 5s</text>
    <text x="760" y="85">t = 8s</text>
    <text x="940" y="85">t = 10s</text>
  </g>

  <!-- Lane 1: Merchant View -->
  <rect x="40" y="115" width="970" height="120" rx="10" fill="#21262d" fill-opacity="0.4" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#58a6ff">LANE A: MERCHANT OBSERVED STATE</text>
  
  <!-- Merchant Events -->
  <g filter="url(#shadow2)">
    <!-- Event 1: checkout.failed -->
    <rect x="110" y="155" width="130" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="120" y="176" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ff7b72">checkout.failed</text>
    <text x="120" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e">Browser drops</text>
    <text x="120" y="206" font-family="ui-monospace, monospace" font-size="9" fill="#ff7b72">Captured: ₹0</text>

    <!-- Gap -->
    <text x="360" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6e7681" text-anchor="middle">Unaware of Bank Action</text>

    <!-- Event 2: recovery.request (Agent fires) -->
    <rect x="480" y="155" width="165" height="60" rx="6" fill="#381e1e" stroke="#f85149" stroke-width="1.5"/>
    <text x="492" y="176" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ff7b72">recovery.request</text>
    <text x="492" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#ff7b72">Agent initiates retry!</text>
    <text x="492" y="206" font-family="ui-monospace, monospace" font-size="9" fill="#e3b341">Charges +₹5,000</text>

    <!-- Event 3: webhook arrives late -->
    <rect x="710" y="155" width="150" height="60" rx="6" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
    <text x="722" y="176" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#58a6ff">webhook.captured</text>
    <text x="722" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e">Delayed delivery</text>
    <text x="722" y="206" font-family="ui-monospace, monospace" font-size="9" fill="#3fb950">Notifies: Orig OK</text>
  </g>

  <!-- Lane 2: Authoritative Gateway / Bank Ledger -->
  <rect x="40" y="250" width="970" height="120" rx="10" fill="#21262d" fill-opacity="0.4" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#3fb950">LANE B: AUTHORITATIVE GATEWAY / BANK LEDGER</text>

  <!-- Bank Events -->
  <g filter="url(#shadow2)">
    <!-- Bank capture at t=3s -->
    <rect x="290" y="290" width="155" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="302" y="311" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#7ee787">gateway.captured</text>
    <text x="302" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8b949e">Late auth succeeds</text>
    <text x="302" y="341" font-family="ui-monospace, monospace" font-size="9" fill="#3fb950">Ledger: ₹5,000</text>

    <!-- Second capture from Agent recovery -->
    <rect x="485" y="290" width="160" height="60" rx="6" fill="#490202" stroke="#f85149" stroke-width="2"/>
    <text x="497" y="311" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ff7b72">DUPLICATE CHARGE</text>
    <text x="497" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f85149">Ledger: ₹10,000!</text>
    <text x="497" y="341" font-family="ui-monospace, monospace" font-size="9" fill="#ff7b72">₹10,000 &gt; ₹5,000 [BREACH]</text>

    <!-- Guard Intervention Banner -->
    <rect x="680" y="290" width="290" height="60" rx="6" fill="#1b2a20" stroke="#3fb950" stroke-width="1.5"/>
    <text x="692" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7ee787">REPRISE GUARDED INTERVENTION</text>
    <text x="692" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#c9d1d9">Holds recovery: "Original is unresolved"</text>
    <text x="692" y="341" font-family="ui-monospace, monospace" font-size="9" fill="#3fb950">Result: 1 Charge (₹5,000). PASS.</text>
  </g>

  <!-- Failure Connection Arrow -->
  <path d="M 560 215 L 560 285" stroke="#f85149" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Footer explanation -->
  <text x="40" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8b949e">
    <tspan font-weight="700" fill="#f0f6fc">The Core Vulnerability:</tspan> Stale asynchronous webhooks mislead unshielded agents into triggering retries while late authorizations settle in the background.
  </text>
</svg>
